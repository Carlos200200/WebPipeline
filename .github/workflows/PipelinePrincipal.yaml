# WebPipeline principal
# Lo que hay:
# - Pruebas Unitarias Test.py

name: Python CI Pipeline

on:
  pull_request:
    branches: [main]


# Permisos mínimos necesarios para que el flujo pueda escribir en GHCR de forma segura
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository toma automáticamente el formato "mi-usuario/mi-repositorio"
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ----------------------------------------------------------
  # Trabajo 1: Pruebas Unitarias (Python)
  # ----------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descarga Repo
        uses: actions/checkout@v4
  
      # Configurar la ver de python
      - name: Config Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
  
      # Fase 1: Pruebas unitarias
      - name: Instalar pytest
        run: pip install pytest
      - name: Pruebas Unitarias Python
        run: pytest Test_Count

  # ----------------------------------------------------------
  # Trabajo 2: Construcción y envio de la imagen docker a GHCR
  # ----------------------------------------------------------
  Construir-Imagen:
    runs-on: ubuntu-latest
    # Condicionales del job
    needs: unit-tests

    steps:
      - name: Descarga Repo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker container no permite nombres en Mayuscula
      - name: Formatear nombre de imagen a minusculas
        id: string
        run: |
          echo "image_lowercase=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}


      # Esto indica que mejora la compilacion de las imagenes
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}